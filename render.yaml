services:
  - type: web
    name: school-management-system
    runtime: docker
    plan: starter
    autoDeploy: false
    healthCheckPath: /assets/css/dashboard.css
    disk:
      name: admissions-uploads
      mountPath: /var/www/html/storage/uploads
      sizeGB: 1
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
